<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · ViduMarket</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="page-header">
        <div>
          <h1 class="page-title">Welcome back</h1>
          <p class="subtitle">Login to manage your orders, studio, and account.</p>
        </div>
        <a class="button secondary" href="index.html">Back to Home</a>
      </div>

      <section class="card">
        <form data-login-form class="grid" style="gap: 20px;">
          <div class="form-group">
            <label class="form-label" for="username">Email or Username</label>
            <input class="input" id="username" data-username type="text" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-with-icon">
              <input class="input" id="password" data-password type="password" placeholder="••••••••" required />
              <button class="icon-button" data-toggle data-target="#password" type="button" aria-label="Show password">
                <span class="sr-only">Toggle password visibility</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path class="eye-open" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"></path>
                  <circle class="eye-open" cx="12" cy="12" r="3"></circle>
                  <path class="eye-closed" d="M3 3l18 18"></path>
                  <path class="eye-closed" d="M10.5 6.5C11 6.3 11.5 6.2 12 6.2c6 0 9.5 5.8 9.5 5.8-.7 1.1-1.7 2.3-2.9 3.4"></path>
                  <path class="eye-closed" d="M6.2 9.4C4.2 10.9 3 12 3 12s4 6.8 9 6.8c1.3 0 2.5-.2 3.5-.6"></path>
                </svg>
              </button>
            </div>
          </div>
          <div class="alert error" data-alert></div>
          <button class="button" type="submit">Login</button>
        </form>
      </section>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
